<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incoming deliveries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f151c;--panel:#17202a;--line:#263341;--text:#e6edf3;--mute:#8b9bab;--green:#1f9d55;--red:#e5484d;--amber:#e9a23b;--blue:#4c8dff;--r:6px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 "Barlow Semi Condensed",system-ui,Segoe UI,Arial,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.2px}
.sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);border-radius:0}
.seg button:last-child{border-right:0}
button,select,input,textarea{font:inherit;color:var(--text)}
button{background:var(--panel);border:1px solid var(--line);padding:6px 12px;border-radius:var(--r);cursor:pointer}
button:hover{border-color:var(--mute)}
button.on{background:var(--blue);border-color:var(--blue);color:#fff}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
button.ok{background:var(--green);border-color:var(--green);color:#fff}
button.bad{color:var(--red)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.stats{display:flex;gap:18px;font-size:15px;color:var(--mute)}
.stats b{color:var(--text);font-size:20px;margin-right:4px}
.stats .late b{color:var(--red)}
#clock{font-size:26px;font-weight:600;display:none}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 18px 18px;gap:10px}
#msg{display:none;background:#3a1d20;border:1px solid var(--red);padding:8px 12px;border-radius:var(--r)}
.legend{display:flex;gap:14px;font-size:14px;color:var(--mute);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cal{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:1fr;gap:16px;align-content:start}
.mon{display:flex;flex-direction:column;min-width:0;min-height:0;border:3px solid #3b4d63;border-radius:10px;overflow:hidden;background:#3b4d63}
.mgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,.55fr) minmax(0,.55fr);grid-template-rows:auto repeat(var(--n),minmax(var(--rh,96px),auto));gap:4px;background:#3b4d63;flex:1;min-height:0}
.dow{background:var(--panel);padding:4px 8px;font-weight:600;color:var(--mute);font-size:clamp(12px,.9vw,18px)}
.day{background:#16212d;min-height:0;padding:4px 5px;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:6px;align-items:start;overflow:hidden;cursor:pointer}
.ch{display:flex;flex-direction:column;gap:3px;min-width:0;min-height:0}
.mh{background:var(--panel);padding:8px 14px;font-size:clamp(18px,1.6vw,34px);font-weight:700;border-left:8px solid var(--blue)}
.mon.mc1 .mh{border-left-color:var(--amber)}
.tv .mh{padding:4px 14px;font-size:clamp(16px,2.4vh,32px)}

.day.mc1{background:#1d2c3f}
.day.we{background:#0a0f15}
.day.mc1.we{background:#0d1520}
.pj{display:inline-block;background:rgba(255,255,255,.2);border-radius:3px;padding:0 .4em;margin-right:.4em;font-weight:700;white-space:nowrap}
.wd{display:none}

.day.pad{background:#090d12;cursor:default}
.day.past{opacity:.6}
.day.today{box-shadow:inset 0 0 0 4px var(--amber);background:#2e2812;opacity:1}
.dn{display:flex;flex-direction:column;align-items:center;align-self:stretch;min-width:1.7em;font-size:12px;color:var(--mute);border-right:2px solid rgba(255,255,255,.16);padding-right:6px}
.dn b{color:var(--text);font-size:17px}
.dn em{font-style:normal;color:var(--amber);font-weight:600}
.chip{border-left:5px solid var(--blue);background:#2d4058;border-radius:4px;padding:2px 6px;font-size:14px;line-height:1.25;cursor:pointer;overflow:hidden;white-space:normal;overflow-wrap:anywhere;hyphens:auto;flex:none;border-top:0;border-right:0;border-bottom:0;text-align:left;width:100%;display:block}
.chip b{font-weight:600}
.chip.wait{border-color:var(--blue)}
.chip.soon,.chip.today{border-color:var(--amber);background:#4a3a14}
.chip.done{border-color:var(--green);background:#12301f;color:#b7e4c7}
.chip.cancel{border-color:#6b7785;background:var(--panel);color:var(--mute);text-decoration:line-through}
.tag.cancel{background:#6b7785}
.chip.late{border-color:var(--red);background:var(--red);color:#fff;font-weight:600}
.more{flex:none;font-size:12px;color:var(--mute)}
.strip{display:none;gap:6px;align-items:center;flex-wrap:wrap}
.strip .chip{width:auto;max-width:260px;white-space:nowrap;text-overflow:ellipsis}
.strip span{color:var(--red);font-weight:700}
.tv .day{min-height:0}
.tv .cal{overflow:hidden;grid-template-rows:minmax(0,1fr)}
.tv .mgrid{grid-template-rows:auto repeat(var(--n),minmax(0,1fr))}
.tv .dn b{font-size:clamp(12px,2vh,24px)}
.tv .chip{font-size:var(--fs,clamp(13px,calc(.6vw + .85vh),28px));padding:.15em .45em;line-height:1.15}
.tv .day .ch{gap:2px}
.tv .dn{font-size:clamp(11px,1.6vh,20px)}
.day.co .pt{display:none}
.tv .mgrid{grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,.5fr) minmax(0,.5fr)}
.tv .more{font-size:clamp(12px,1.8vh,22px);color:var(--amber);font-weight:600}
.more:empty{display:none}
.tv .strip{max-height:9vh;overflow:hidden}
.tv .strip .chip{font-size:clamp(12px,2vh,24px);max-width:48vw;width:auto;padding:3px 8px}
.tv .strip span{font-size:clamp(13px,2vh,24px)}
.tv .legend{font-size:clamp(12px,1.8vh,22px)}
.tv header .ctl,.tv #addBtn,.tv .legend .hide,.tv #viewSeg{display:none}
.tv #clock{display:block;font-size:clamp(20px,3.4vh,42px)}
.tv{overflow:hidden;width:100vw;height:100vh}
.tv header{padding:1.2vh 3vw}
.tv main{padding:0 3vw 2.5vh;gap:1vh}
.tv h1{font-size:clamp(22px,3.2vh,42px)}
.tv .stats{font-size:clamp(14px,2.2vh,28px)}
.tv .stats b{font-size:clamp(20px,3.4vh,42px)}
.list{overflow:auto;flex:1}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--bg)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:13px;font-weight:600}
.tag.late{background:var(--red)}.tag.done{background:var(--green)}.tag.soon,.tag.today{background:var(--amber);color:#1a1200}.tag.wait{background:var(--blue)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;width:100%}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(520px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form label{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--mute)}
form .full{grid-column:1/-1}
.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.hist{grid-column:1/-1;font-size:13px;color:var(--mute)}
@media(max-width:700px){.wd{display:inline;color:var(--mute)}h1{font-size:18px}header,main{padding-left:12px;padding-right:12px}.pad{display:none}.mgrid{grid-template-columns:1fr;grid-template-rows:none;grid-auto-rows:auto}.dow{display:none}.day.we:not(:has(.chip)){display:none}.day:not(:has(.chip)):not(.today){min-height:34px}}
@media(prefers-reduced-motion:no-preference){.chip.late{animation:pulse 2.4s ease-in-out infinite}}
@keyframes pulse{50%{filter:brightness(1.25)}}
</style>
</head>
<body>
<header>
  <h1>Incoming deliveries</h1>
  <div class="stats" id="stats"></div>
  <span class="sp"></span>
  <span id="clock"></span>
  <div class="ctl tools">
    <div class="seg" id="viewSeg"><button data-view="cal" class="on">Calendar</button><button data-view="list">List</button></div>
    <div class="seg" id="navSeg"><button data-n="-1" aria-label="Previous week">‹</button><button data-n="0">This week</button><button data-n="1" aria-label="Next week">›</button></div>
    <button id="tvBtn">TV mode</button>
  </div>
  <button class="pri" id="addBtn">Add delivery</button>
</header>
<main>
  <div id="msg"></div>
  <div class="strip" id="strip"></div>
  <div class="legend">
    <span><i style="background:var(--blue)"></i>Due</span>
    <span><i style="background:var(--amber)"></i>Due within 3 days</span>
    <span><i style="background:var(--green)"></i>Delivered</span>
    <span><i style="background:var(--red)"></i>Overdue: chase it</span>
    <span class="hide">Click a delivery to update it. Press Esc to leave TV mode.</span>
  </div>
  <div class="tools" id="listTools" style="display:none">
    <input id="q" placeholder="Search company, part, reference" style="max-width:300px">
    <select id="fs" style="max-width:180px"><option value="open">Open</option><option value="late">Overdue</option><option value="done">Delivered</option><option value="all">All</option></select>
  </div>
  <div class="cal" id="cal"></div>
  <div class="list" id="list" style="display:none"></div>
</main>

<dialog id="dlg">
  <form id="f" method="dialog">
    <label class="full">Company / supplier<input id="company" list="cos" required autocomplete="off"></label>
    <datalist id="cos"></datalist>
    <label class="full">Part / description<input id="part" required></label>
    <label>Due date<input id="due" type="date" required></label>
    <label>Quantity<input id="qty" type="number" min="1" value="1"></label>
    <label>PO / reference<input id="ref"></label>
    <label>Project number<input id="job"></label>
    <label class="full">Notes<textarea id="notes" rows="2"></textarea></label>
    <div class="hist" id="hist"></div>
    <div class="acts">
      <button type="submit" class="pri" id="save">Save</button>
      <button type="button" class="ok" id="dlv">Mark delivered</button>
      <button type="button" id="chs">Log chase</button>
      <button type="button" class="bad" id="del">Delete</button>
      <button type="button" id="cancel">Close</button>
    </div>
  </form>
</dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,addDoc,updateDoc,deleteDoc,doc,onSnapshot,serverTimestamp,increment} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJXVZE2VZXPH9jJvzgz9ozBvvbiJfmLbw",
  authDomain: "teamdennisontracker.firebaseapp.com",
  projectId: "teamdennisontracker",
  storageBucket: "teamdennisontracker.firebasestorage.app",
  messagingSenderId: "915336870349",
  appId: "1:915336870349:web:c070e9b3fc0b688fe62c84"
};
const db = getFirestore(initializeApp(firebaseConfig));
const COL = collection(db, "shipments");

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const nice = s => s ? parse(s).toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short", year:"numeric"}) : "No date";

let items = [], view = "cal", off = 0, editing = null;
const params = new URLSearchParams(location.search);
if (params.get("view") === "list") view = "list";

function status(it){
  const t = iso(new Date());
  if (it.cancelled) return "cancel";
  if (it.delivered) return "done";
  if (!it.due) return "wait";
  if (it.due < t) return "late";
  if (it.due === t) return "today";
  if (it.due <= iso(addDays(new Date(), 3))) return "soon";
  return "wait";
}
const label = {cancel:"Cancelled", late:"Overdue", done:"Delivered", today:"Due today", soon:"Due soon", wait:"Due"};
const chipHTML = it => `<button class="chip ${status(it)}" data-id="${it.id}" title="${esc(it.company)}: ${esc(it.part)}${it.job ? " · Project " + esc(it.job) : ""}${it.ref ? " (PO " + esc(it.ref) + ")" : ""}">${it.job ? `<span class="pj">${esc(it.job)}</span>` : ""}<b>${esc(it.company)}</b><span class="pt"> ${esc(it.part)}${it.qty > 1 ? " ×" + it.qty : ""}</span></button>`;

onSnapshot(COL, snap => {
  items = snap.docs.map(d => ({id:d.id, ...d.data()}));
  $("msg").style.display = "none";
  $("cos").innerHTML = [...new Set(items.map(i => i.company))].sort().map(c => `<option value="${esc(c)}">`).join("");
  render();
}, err => {
  $("msg").style.display = "block";
  $("msg").textContent = "Can’t read the shipments collection: " + err.message + ". Check the Firestore rules allow reads and writes on “shipments”.";
});

function render(){
  const late = items.filter(i => status(i) === "late").length;
  const wk = iso(addDays(new Date(), 7)), t = iso(new Date());
  const week = items.filter(i => !i.delivered && !i.cancelled && i.due >= t && i.due <= wk).length;
  const done = items.filter(i => i.delivered && i.deliveredOn === t).length;
  $("stats").innerHTML = `<span class="late"><b>${late}</b>overdue</span><span><b>${week}</b>due in 7 days</span><span><b>${done}</b>delivered today</span>`;
  $("viewSeg").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.view === view));
  $("cal").style.display = view === "cal" ? "grid" : "none";
  $("list").style.display = view === "list" ? "block" : "none";
  $("listTools").style.display = view === "list" ? "flex" : "none";
  $("navSeg").style.display = view === "cal" ? "" : "none";
  view === "cal" ? renderCal() : renderList();
}

function renderCal(){
  const now = new Date(), today = iso(now), idx = d => (d.getDay() + 6) % 7;
  const start = addDays(now, -idx(now) - 7 + off * 7), end = addDays(start, 34), startIso = iso(start);
  const by = {};
  items.forEach(i => (by[i.due] = by[i.due] || []).push(i));
  const old = items.filter(i => status(i) === "late" && i.due < startIso).sort((a,b) => a.due.localeCompare(b.due));
  const nodate = items.filter(i => !i.due && !i.delivered && !i.cancelled);
  const strip = $("strip");
  strip.style.display = old.length || nodate.length ? "flex" : "none";
  strip.innerHTML = (old.length ? `<span>Overdue from earlier:</span>` + old.map(chipHTML).join("") : "") +
    (nodate.length ? `<span style="color:var(--amber);margin-left:10px">No due date:</span>` + nodate.map(chipHTML).join("") : "");
  let h = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < 35; i++){
    const d = addDays(start, i), key = iso(d);
    const list = (by[key] || []).sort((a,b) => (a.delivered - b.delivered) || a.company.localeCompare(b.company));
    const mo = i === 0 || d.getDate() === 1 ? `<em>${d.toLocaleDateString("en-GB", {month:"short"})}</em>` : "";
    h += `<div class="day mc${d.getMonth() % 2}${d.getDay()%6===0?" we":""}${key<today?" past":""}${key===today?" today":""}" data-date="${key}"><div class="dn"><span class="wd">${d.toLocaleDateString("en-GB",{weekday:"short"})}</span><b>${d.getDate()}</b>${mo}</div><div class="ch">` + list.map(chipHTML).join("") + `</div></div>`;
  }
  const f = (d, y) => d.toLocaleDateString("en-GB", {day:"numeric", month:"short", ...(y ? {year:"numeric"} : {})});
  $("cal").innerHTML = `<section class="mon mc0"><div class="mh">${f(start)} – ${f(end, true)}</div><div class="mgrid" style="--n:5">${h}</div></section>`;
  fitTV();
}

// TV only: shrink or drop chips until every day fits its cell, so no text is cut off mid-line.
function fitTV(){
  if (!document.body.classList.contains("tv")) return;
  const over = el => el.scrollHeight > el.clientHeight + 1;
  document.querySelectorAll(".day:not(.pad)").forEach(d => {
    const chips = [...d.querySelectorAll(".chip")];
    if (!chips.length || !over(d)) return;
    const base = parseFloat(getComputedStyle(chips[0]).fontSize);
    const shrink = () => {
      for (let f = base; f >= 11; f -= .5){ d.style.setProperty("--fs", f + "px"); if (!over(d)) return true; }
      return false;
    };
    if (shrink()) return;
    d.classList.add("co");
    if (shrink()) return;
    const more = document.createElement("div");
    more.className = "more"; d.querySelector(".ch").appendChild(more);
    let hidden = 0;
    while (chips.length > 1 && over(d)){ chips.pop().remove(); more.textContent = "+" + (++hidden) + " more"; }
  });
  const st = $("strip"), chips = [...st.querySelectorAll(".chip")];
  if (!chips.length) return;
  const more = document.createElement("span"); more.className = "more"; st.appendChild(more);
  let hidden = 0;
  while (chips.length > 1 && over(st)){ chips.pop().remove(); more.textContent = "+" + (++hidden) + " more"; }
}

function renderList(){
  const q = $("q").value.toLowerCase(), f = $("fs").value;
  const rows = items.filter(i => {
    const s = status(i);
    if (f === "open" && (i.delivered || i.cancelled)) return false;
    if (f === "late" && s !== "late") return false;
    if (f === "done" && !i.delivered) return false;
    return !q || [i.company, i.part, i.ref, i.job, i.notes].join(" ").toLowerCase().includes(q);
  }).sort((a,b) => a.due.localeCompare(b.due));
  $("list").innerHTML = rows.length ? `<table><thead><tr><th>Due</th><th>Company</th><th>Part</th><th>Qty</th><th>Project</th><th>PO</th><th>Status</th><th>Chased</th><th></th></tr></thead><tbody>` +
    rows.map(i => `<tr><td>${nice(i.due)}</td><td>${esc(i.company)}</td><td>${esc(i.part)}<div class="more">${esc(i.notes)}</div></td><td>${i.qty||1}</td><td>${esc(i.job)}</td><td>${esc(i.ref)}</td><td><span class="tag ${status(i)}">${label[status(i)]}</span>${i.delivered && i.deliveredOn ? `<div class="more">${nice(i.deliveredOn)}</div>` : ""}</td><td>${i.chased||0}${i.lastChased ? `<div class="more">${nice(i.lastChased)}</div>` : ""}</td><td><button data-id="${i.id}" class="rowedit">Open</button></td></tr>`).join("") + `</tbody></table>`
    : `<p style="color:var(--mute);padding:20px">No deliveries match. Use “Add delivery” to log one.</p>`;
}

function openDlg(it, date){
  editing = it || null;
  $("company").value = it?.company || ""; $("part").value = it?.part || "";
  $("due").value = it?.due || date || iso(new Date()); $("qty").value = it?.qty || 1;
  $("ref").value = it?.ref || ""; $("job").value = it?.job || ""; $("notes").value = it?.notes || "";
  $("dlv").style.display = $("chs").style.display = $("del").style.display = it ? "" : "none";
  $("dlv").textContent = it?.delivered ? "Undo delivered" : "Mark delivered";
  $("dlv").className = it?.delivered ? "" : "ok";
  $("hist").textContent = it ? `Chased ${it.chased||0} time(s)${it.lastChased ? ", last on " + nice(it.lastChased) : ""}${it.delivered && it.deliveredOn ? ". Delivered " + nice(it.deliveredOn) : ""}.` : "";
  $("dlg").showModal();
}
const guard = p => p.catch(e => alert("Couldn’t save: " + e.message));

$("f").addEventListener("submit", e => {
  const data = {company:$("company").value.trim(), part:$("part").value.trim(), due:$("due").value, qty:+$("qty").value || 1,
    ref:$("ref").value.trim(), job:$("job").value.trim(), notes:$("notes").value.trim()};
  guard(editing ? updateDoc(doc(db,"shipments",editing.id), data)
    : addDoc(COL, {...data, delivered:false, chased:0, createdAt:serverTimestamp()}));
});
$("dlv").onclick = () => { guard(updateDoc(doc(db,"shipments",editing.id), editing.delivered ? {delivered:false, deliveredOn:null} : {delivered:true, deliveredOn:iso(new Date())})); $("dlg").close(); };
$("chs").onclick = () => { guard(updateDoc(doc(db,"shipments",editing.id), {chased:increment(1), lastChased:iso(new Date())})); $("dlg").close(); };
$("del").onclick = () => { if (confirm("Delete this delivery?")) { guard(deleteDoc(doc(db,"shipments",editing.id))); $("dlg").close(); } };
$("cancel").onclick = () => $("dlg").close();
$("addBtn").onclick = () => openDlg();

document.addEventListener("click", e => {
  const c = e.target.closest("[data-id]");
  if (c) return openDlg(items.find(i => i.id === c.dataset.id));
  const d = e.target.closest(".day");
  if (d && !document.body.classList.contains("tv")) openDlg(null, d.dataset.date);
});
$("viewSeg").onclick = e => { if (e.target.dataset.view) { view = e.target.dataset.view; render(); } };
$("navSeg").onclick = e => { const n = e.target.dataset.n; if (n !== undefined) { off = n === "0" ? 0 : off + +n; render(); } };
$("q").oninput = $("fs").onchange = renderList;

function tv(on){
  document.body.classList.toggle("tv", on);
  if (on) { view = "cal"; off = 0; render(); document.documentElement.requestFullscreen?.().catch(() => {}); }
  else { if (document.fullscreenElement) document.exitFullscreen(); render(); }
}
$("tvBtn").onclick = () => tv(true);
document.addEventListener("keydown", e => { if (e.key === "Escape") tv(false); });
if (params.get("tv") === "1") { document.body.classList.add("tv"); view = "cal"; }




setInterval(() => { $("clock").textContent = new Date().toLocaleString("en-GB", {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}); }, 1000);
setInterval(() => { if (!$("dlg").open) render(); }, 60000);
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 200); });
document.fonts?.ready.then(render);
render();
